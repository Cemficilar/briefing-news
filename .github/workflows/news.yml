name: News aktualisieren
on:
  schedule:
    - cron: "7 5-22 * * *"   # stündlich (UTC) – deckt 6–23 Uhr MEZ ab
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python newsbot/scripts/build_news.py
      - name: Änderungen speichern
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add newsbot/data/news.json
          git diff --cached --quiet || (git commit -m "News aktualisiert" && git push)
